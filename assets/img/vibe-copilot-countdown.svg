<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">I Didn't Know Copilot Could Do That session cover</title>
  <desc id="desc">A blue and pink session cover with a ten-to-one countdown motif.</desc>
  <rect width="1200" height="675" rx="36" fill="#f0f8ff"/>
  <circle cx="1040" cy="120" r="220" fill="#fff0f5"/>
  <circle cx="1080" cy="560" r="250" fill="#dceeff"/>
  <g font-family="Arial, sans-serif" font-weight="700">
    <text x="90" y="105" font-size="34" fill="#185fa5" letter-spacing="3">VIBE SESSION</text>
    <text x="90" y="220" font-size="68" fill="#111111">I Didn't Know</text>
