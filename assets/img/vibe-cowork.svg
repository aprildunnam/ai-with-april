<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Delegating Real Work to Copilot Cowork session cover</title>
  <desc id="desc">A polished pink and blue Vibe 2.0 session cover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0f5"/>
      <stop offset="1" stop-color="#f0f8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="155" fill="#29abe2" opacity=".11"/>
